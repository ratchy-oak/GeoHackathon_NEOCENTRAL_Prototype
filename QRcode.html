<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code - Neo Central</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h2 {
      color: #22d3ee;
      letter-spacing: 0.05rem;
    }
    #qrcode {
      margin-top: 20px;
      padding: 20px;
      background: rgba(30, 41, 59, 0.6);
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(34, 211, 238, 0.2);
    }
    p {
      color: #94a3b8;
      margin-top: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h2>Scan to Open Neo Central</h2>
  <div id="qrcode"></div>
  <p>https://lightsteelblue-vulture-891017.hostingersite.com/index.html</p>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://colab.research.google.com/drive/1KraPy2xcAiweiNC3v4KA4xEzsiIsJDbn?usp=sharing",
      width: 200,
      height: 200,
      colorDark: "#22d3ee",
      colorLight: "#0f172a",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
